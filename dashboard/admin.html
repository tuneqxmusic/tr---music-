<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin — TR MUSIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-body">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">TR <span>MUSIC</span></a>
            <div class="user-badge badge-master-admin">
                <i class="fas fa-crown"></i>
                <span>Master Admin: Sandeep Kumar</span>
            </div>
            <a href="../login.html" class="btn btn-glass btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </header>

    <div class="container dashboard-container">
        <div class="dashboard-header glass-card">
            <div>
                <h2>Master Control <span>Center</span></h2>
                <p>Review incoming song requests, approve releases, or reject with feedback.</p>
            </div>
        </div>

        <div class="glass-card table-card" style="margin-top: 20px;">
            <div class="table-header">
                <h3><i class="fas fa-tasks"></i> Incoming Sub-Admin Submissions</h3>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Track Title</th>
                            <th>Artist & Composer</th>
                            <th>Submitted Date</th>
                            <th>Status</th>
                            <th>Decision Actions</th>
                        </tr>
                    </thead>
                    <tbody id="masterTableBody">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
