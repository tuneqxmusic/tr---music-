<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Admin Portal — TR MUSIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-body">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">TR <span>MUSIC</span></a>
            <div class="user-badge">
                <i class="fas fa-compact-disc"></i>
                <span>Sub-Admin Panel</span>
            </div>
            <a href="../login.html" class="btn btn-glass btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </header>

    <div class="container dashboard-container">
        <div class="dashboard-header glass-card">
            <div>
                <h2>Sub-Admin <span>Catalog Portal</span></h2>
                <p>Upload new tracks directly for Master Admin review & distribution.</p>
            </div>
            <button class="btn btn-glow" onclick="document.getElementById('uploadModal').style.display='flex'">
                <i class="fas fa-cloud-upload-alt"></i> Submit New Track
            </button>
        </div>

        <div class="glass-card table-card">
            <div class="table-header">
                <h3><i class="fas fa-music"></i> My Track Submissions</h3>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Track Title</th>
                            <th>Artist</th>
                            <th>ISRC</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody">
                        <!-- Dynamic items via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal-overlay" style="display: none;">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-upload"></i> Upload New Track</h3>
                <span class="close-btn" onclick="document.getElementById('uploadModal').style.display='none'">&times;</span>
            </div>

            <form id="songUploadForm" class="upload-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Song Title *</label>
                        <input type="text" id="songTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Singer / Artist *</label>
                        <input type="text" id="songArtist" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Composer *</label>
                        <input type="text" id="songComposer" required>
                    </div>
                    <div class="form-group">
                        <label>Audio File (.WAV / .MP3) *</label>
                        <input type="file" accept="audio/*" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-glass" onclick="document.getElementById('uploadModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-glow">Submit to Master Admin</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/upload.js"></script>
</body>
</html>
